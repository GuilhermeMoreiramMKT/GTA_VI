name: GTA Viral Radar - Twitch chat collector
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gta-twitch-chat-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect and analyze live Twitch chat
        env:
          RADAR_BASE_URL: ${{ secrets.RADAR_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/twitch-collector.mjs
