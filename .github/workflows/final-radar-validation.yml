name: Final radar validation (no publication)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-radar-validation.yml'
permissions:
  contents: read
concurrency:
  group: radar-final-validation
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      RADAR_BASE_URL: ${{ secrets.RADAR_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install discovery tool
        run: |
          python3 -m venv /tmp/radar-venv
          /tmp/radar-venv/bin/python -m pip install --disable-pip-version-check 'yt-dlp==2026.11.23'
      - name: Verify public discovery and streaming sources
        id: discovery
        run: |
          set -euo pipefail
          mkdir -p output
          case "$RADAR_BASE_URL" in https://gta-viral-radar.vercel.app|https://gta-viral-radar.vercel.app/) ;; *) exit 1;; esac
          /tmp/radar-venv/bin/python scripts/discover_kick.py --output output/kick.json
          /tmp/radar-venv/bin/python scripts/discover_kick.py --channels coringa,paulinholokobr,bistecone,gabepeixe --output output/br-comparison.json
          curl -fsS --max-time 65 -H "Authorization: Bearer $CRON_SECRET" "${RADAR_BASE_URL%/}/api/cron/clip-candidates" > output/candidates.json
          python3 - <<'PY'
          import json, os
          from scripts.produce_candidate import declared_creator
          d=json.load(open("output/candidates.json"))
          k=json.load(open("output/kick.json"))
          print("Providers:", d["providers"], "Kick:", k["provider"], "Qualified Kick clips:", len(k["candidates"]))
          assert d["providers"]["twitch"]=="fulfilled" and d["providers"]["youtube"]=="fulfilled"
          assert d.get("editorialFocus")=="coringa" and k["provider"]=="ok"
          d["candidates"]=d["candidates"]+k["candidates"]
          assert all(declared_creator(c) for c in d["candidates"])
          json.dump(d,open("output/candidates.json","w"))
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              print("has_candidate="+str(bool(d["candidates"])).lower(),file=out)
          comparison=json.load(open("output/br-comparison.json"))
          json.dump({"editorialFocus":"coringa","run":os.environ["GITHUB_RUN_ID"],"comparison":True,"channels":comparison["channels"]},open("output/br-comparison-receipt.json","w"))
          PY
          curl -fsS --max-time 30 -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" --data-binary @output/br-comparison-receipt.json "${RADAR_BASE_URL%/}/api/cron/production-intake?action=focus-receipt"
      - name: Install media and subtitle tools
        if: steps.discovery.outputs.has_candidate == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          /tmp/radar-venv/bin/python -m pip install --disable-pip-version-check 'faster-whisper==1.1.1' 'ctranslate2==4.6.0' 'sentencepiece==0.2.0' 'requests==2.32.5' 'huggingface-hub==0.29.3'
      - name: Verify subtitles on a real scored clip
        if: steps.discovery.outputs.has_candidate == 'true'
        run: |
          export PATH="/tmp/radar-venv/bin:$PATH"
          python scripts/produce_candidate.py --candidates output/candidates.json --output output
          python - <<'PY'
          import json
          d=json.load(open("output/manifest.json"))
          rows=json.load(open("output/transcricao.json"))
          assert d["subtitle_method"]=="contextual-sentences-idiom-aware-v3"
          assert d["subtitle_language"]=="pt-BR" and d["public_post"] is False
          assert 30<=d["duration"]<=45.1 and d["candidate"]["score"]>=80
          assert all(0<=r["start"]<r["end"]<=d["duration"]+0.1 and r["text"].strip() for r in rows)
          for row in rows:
              original = row.get("original","").lower()
              translated = row["text"].lower()
              if "ingest everything about" in original: assert "comer tudo" not in translated
              if "where they work out" in original: assert "trabalham fora" not in translated
          print("Validated segments:", len(rows), "Duration:",d["duration"],"Score:",d["candidate"]["score"])
          PY
      - name: Check both social destinations
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 5 --max-time 60 -X POST -H "Authorization: Bearer $CRON_SECRET" "${RADAR_BASE_URL%/}/api/cron/buffer?action=health" > output/social-health.json || { cat output/social-health.json; exit 1; }
          python3 - <<'PY'
          import json
          h=json.load(open("output/social-health.json"))
          assert h.get("ok") and h.get("instagram") and h.get("tiktok")
          print("Both destinations connected; no posts requested.")
          PY
      - name: Save final validation evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-radar-validation
          path: |
            output/kick.json
            output/br-comparison.json
            output/candidates.json
            output/clip.mp4
            output/manifest.json
            output/transcricao.json
            output/legendagem-pt-br.ass
            output/social-health.json
          retention-days: 5
          if-no-files-found: warn

      - name: Record final validation receipt
        if: success() && steps.discovery.outputs.has_candidate == 'true'
        env:
          VALIDATION_RESULT: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          def read(name):
              try: return json.loads(Path("output",name).read_text())
              except (ValueError,OSError): return None
          kick=read("kick.json") or {}
          candidates=read("candidates.json") or {}
          manifest=read("manifest.json")
          rows=read("transcricao.json") or []
          payload={"run":os.environ["GITHUB_RUN_ID"],"result":os.environ["VALIDATION_RESULT"],"kick":{k:kick.get(k) for k in ("provider","channels")},"providers":candidates.get("providers"),"candidateCount":len(candidates.get("candidates",[])),"kickCandidates":[{key:c.get(key) for key in ("id","channel","score","duration","views","source")} for c in kick.get("candidates",[])],"manifest":manifest,"subtitleSample":rows[:8],"social":read("social-health.json")}
          Path("/tmp/radar-final-receipt.json").write_text(json.dumps(payload))
          PY
          for attempt in {1..24}; do
            code=$(curl -sS --max-time 30 -o /tmp/radar-record-result.json -w '%{http_code}' -X POST -H "Authorization: Bearer $CRON_SECRET" -H 'Content-Type: application/json' --data-binary @/tmp/radar-final-receipt.json "${RADAR_BASE_URL%/}/api/cron/production-intake?action=validation-receipt" || true)
            if [ "$code" = 200 ]; then echo "Validation receipt stored"; exit 0; fi
            if [ "$code" = 401 ]; then exit 1; fi
            sleep 10
          done
          echo "Validation receipt unavailable"; exit 1
