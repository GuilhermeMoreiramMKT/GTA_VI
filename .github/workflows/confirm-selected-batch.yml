name: Confirm selected batch in Buffer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/confirm-selected-batch.yml'
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      RADAR_BASE_URL: ${{ secrets.RADAR_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Confirm scheduled posts and connected profiles
        run: |
          set -euo pipefail
          case "$RADAR_BASE_URL" in https://gta-viral-radar.vercel.app|https://gta-viral-radar.vercel.app/) ;; *) exit 1;; esac
          for attempt in {1..30}; do
            status=$(curl -sS --max-time 65 -o /tmp/radar-batch.json -w '%{http_code}' -X POST -H "Authorization: Bearer $CRON_SECRET" "${RADAR_BASE_URL%/}/api/cron/buffer?action=batch-status" || true)
            if [ "$status" = 200 ]; then break; fi
            if [ "$status" = 401 ]; then exit 1; fi
            if [ "$status" = 502 ]; then cat /tmp/radar-batch.json; exit 1; fi
            sleep 10
          done
          test "$status" = 200
          python3 - <<'PY'
          import json
          data=json.load(open("/tmp/radar-batch.json"))
          print(json.dumps({"profiles":data["profiles"],"posts":[{"id":p["id"],"instagram":p.get("instagram"),"tiktok":p.get("tiktok")} for p in data["posts"]]}))
          assert len(data["posts"])==3 and all(p.get("instagram") and p.get("tiktok") for p in data["posts"])
          PY
