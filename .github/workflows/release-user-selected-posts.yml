name: Release selected GTA Viral Radar posts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-user-selected-posts.yml'
permissions: {}
concurrency:
  group: radar-user-selected-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      RADAR_BASE_URL: ${{ secrets.RADAR_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Prepare the three selected clips for publication
        run: |
          set -euo pipefail
          case "$RADAR_BASE_URL" in https://gta-viral-radar.vercel.app|https://gta-viral-radar.vercel.app/) ;; *) exit 1;; esac
          for id in 291e9301-d2b9-4b1a-9962-f2c470bdfe35 ae781fa8-f0f6-47b9-b61a-c025e7363e48 210ea188-8530-4ac7-b1fd-14515169dc88; do
            for attempt in {1..24}; do
              status=$(curl -sS --max-time 65 -o /tmp/radar-release.json -w '%{http_code}' -X POST -H "Authorization: Bearer $CRON_SECRET" -H 'Content-Type: application/json' --data "{\"id\":\"$id\"}" "${RADAR_BASE_URL%/}/api/cron/production-intake?action=release-user-batch" || true)
              if [ "$status" = 200 ]; then break; fi
              if [ "$status" = 400 ]; then sleep 10; continue; fi
              echo "Release failed, HTTP $status"; cat /tmp/radar-release.json; exit 1
            done
            test "$status" = 200
            cat /tmp/radar-release.json
          done
      - name: Start delivery to Instagram and TikTok
        run: |
          set -euo pipefail
          for index in 1 2 3; do
            curl -fsS --max-time 70 -X POST -H "Authorization: Bearer $CRON_SECRET" "${RADAR_BASE_URL%/}/api/cron/buffer?action=schedule" > /tmp/radar-delivery.json
            cat /tmp/radar-delivery.json
            python3 - <<'PY'
          import json
          r=json.load(open("/tmp/radar-delivery.json"))
          assert r.get("ok") and not r.get("paused") and not r.get("review")
          PY
            sleep 5
          done
