name: Confirm autonomous radar readiness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-radar-readiness.yml'
permissions: {}
concurrency:
  group: radar-readiness-check
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      RADAR_BASE_URL: ${{ secrets.RADAR_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Confirm final validation gate and both social channels
        run: |
          set -euo pipefail
          case "$RADAR_BASE_URL" in https://gta-viral-radar.vercel.app|https://gta-viral-radar.vercel.app/) ;; *) exit 1;; esac
          for attempt in {1..30}; do
            code=$(curl -sS --max-time 55 -o /tmp/radar-ready.json -w '%{http_code}' -X POST -H "Authorization: Bearer $CRON_SECRET" "${RADAR_BASE_URL%/}/api/cron/buffer?action=readiness" || true)
            if [ "$code" = 200 ]; then break; fi
            if [ "$code" = 401 ]; then exit 1; fi
            sleep 10
          done
          test "$code" = 200
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/radar-ready.json"))
          print(json.dumps(r))
          assert r.get("verified") and r.get("instagram") and r.get("tiktok")
          PY
          # Exercise the real scheduling cycle only if the queue is empty of publication-eligible clips.
          # This proves the unattended no-candidate behavior without publishing a validation clip.
          if python3 -c 'import json,sys;sys.exit(0 if json.load(open("/tmp/radar-ready.json"))["readyJobs"] == 0 else 1)'; then
            curl -fsS --max-time 65 -X POST -H "Authorization: Bearer $CRON_SECRET" "${RADAR_BASE_URL%/}/api/cron/buffer?action=schedule" > /tmp/radar-schedule.json
          fi
      - name: Persist readiness receipt
        if: always()
        env:
          VALIDATION_RESULT: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          def read(path):
              try: return json.loads(Path(path).read_text())
              except (OSError,ValueError): return None
          data={"kind":"readiness","run":os.environ["GITHUB_RUN_ID"],"result":os.environ["VALIDATION_RESULT"],"readiness":read("/tmp/radar-ready.json"),"schedule":read("/tmp/radar-schedule.json")}
          Path("/tmp/radar-readiness-receipt.json").write_text(json.dumps(data))
          PY
          for attempt in {1..24}; do
            code=$(curl -sS --max-time 30 -o /tmp/radar-report.json -w '%{http_code}' -X POST -H "Authorization: Bearer $CRON_SECRET" -H 'Content-Type: application/json' --data-binary @/tmp/radar-readiness-receipt.json "${RADAR_BASE_URL%/}/api/cron/production-intake?action=validation-receipt" || true)
            if [ "$code" = 200 ]; then echo "Readiness receipt recorded"; exit 0; fi
            if [ "$code" = 401 ]; then exit 1; fi
            sleep 10
          done
          exit 1
