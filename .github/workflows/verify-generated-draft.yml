name: Validate generated video in both social drafts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-generated-draft.yml'
permissions: {}
concurrency:
  group: radar-generated-draft-validation
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      RADAR_BASE_URL: ${{ secrets.RADAR_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Validate production delivery as drafts only
        run: |
          set -euo pipefail
          case "$RADAR_BASE_URL" in https://gta-viral-radar.vercel.app|https://gta-viral-radar.vercel.app/) ;; *) exit 1;; esac
          for attempt in {1..24}; do
            status=$(curl -sS --max-time 70 -o /tmp/radar-receipt.json -w '%{http_code}' -X POST -H "Authorization: Bearer $CRON_SECRET" "${RADAR_BASE_URL%/}/api/cron/buffer?action=verify-rendered" || true)
            if [ "$status" = 200 ]; then break; fi
            if [ "$status" = 400 ]; then sleep 10; continue; fi
            echo "Validation endpoint returned HTTP $status"
            exit 1
          done
          test "$status" = 200
          python3 - <<'PY'
          import json
          r = json.load(open("/tmp/radar-receipt.json"))
          print("Instagram draft:", bool(r.get("instagram")))
          print("TikTok draft:", bool(r.get("tiktok")))
          print("Draft-only mode:", r.get("draft") is True)
          assert r.get("ok") and r.get("instagram") and r.get("tiktok") and r.get("draft")
          PY
