name: GTA VI - Mineirador, Transcritor e Clipador
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Optional run containing authorized clip-agent-input artifact
        type: string
      archive_run:
        description: Optional Coringa archive run with timecoded transcripts
        type: string
  workflow_run:
    workflows: ["GTA Viral Radar - automated production validation"]
    branches: [main]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/clip-transcript-match.yml'
      - 'scripts/clip_agents.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: gta-clip-agents
  cancel-in-progress: false
jobs:
  pipeline:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mineirador - receber métricas e gerar links
        env:
          GH_TOKEN: ${{ github.token }}
          DISCOVERY_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_RUN: ${{ inputs.source_run }}
        id: mine
        run: |
          set -euo pipefail
          mkdir -p output inputs/media
          if [ -n "$SOURCE_RUN" ]; then
            [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
            gh run download "$SOURCE_RUN" --name clip-agent-input --dir inputs/media
            input=inputs/media/metrics.json
          elif [ -n "$DISCOVERY_RUN" ]; then
            if ! gh run download "$DISCOVERY_RUN" --name radar-clip-channel-mapping --dir inputs; then exit 0; fi
            input=inputs/clip-channels.json
            if ! jq -e 'has("metricSignals")' "$input" >/dev/null; then exit 0; fi
          else
            printf '[]\n' > inputs/metrics.json
            input=inputs/metrics.json
          fi
          python scripts/clip_agents.py mine --input "$input" --output output/mineirador.json
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Transcritor - extrair áudio e metadados
        if: steps.mine.outputs.ready == 'true'
        run: |
          mkdir -p output/transcripts
          if ! find inputs/media -maxdepth 1 -type f ! -name '*.json' -print -quit | grep -q .; then
            jq '[.[] | {key:(.platform + "-" + .id),status:"authorized_media_missing_or_ambiguous"}]' output/mineirador.json > output/transcritor.json
            exit 0
          fi
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          python -m pip install -q 'yt-dlp==2026.11.23' 'faster-whisper==1.1.1' 'requests==2.32.5' 'huggingface-hub==0.29.3' 'ctranslate2==4.6.0' 'sentencepiece==0.2.0'
          python scripts/clip_agents.py transcribe --input output/mineirador.json --media inputs/media --output output/transcritor.json
      - name: Clipador - localizar e editar trecho do replay
        if: steps.mine.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_RUN: ${{ inputs.archive_run }}
        run: |
          set -euo pipefail
          printf '[]\n' > output/clipador.json
          if ! find output/transcripts -name '*.json' -print -quit | grep -q .; then exit 0; fi
          if [ -f inputs/media/corpus.json ]; then
            cp inputs/media/corpus.json inputs/corpus.json
          else
            run="${ARCHIVE_RUN:-46001609077}"
            [[ "$run" =~ ^[0-9]+$ ]]
            gh run download "$run" --pattern 'coringa-dia-*' --dir inputs
            for block in inputs/coringa-dia-*/; do
              name=$(basename "$block")
              (cd "$block" && zip -q "../$name.zip" index.json transcricao.json)
            done
            python scripts/match_live_transcripts.py --corpus inputs/corpus.json --build inputs/*.zip
          fi
          python scripts/clip_agents.py locate --input output/transcripts --corpus inputs/corpus.json --output output/clipador.json
          python scripts/clip_agents.py render --input output/clipador.json --output output/clipador.json
      - uses: actions/upload-artifact@v4
        if: steps.mine.outputs.ready == 'true'
        with:
          name: radar-agents
          path: |
            output/*.json
            output/transcripts/*.json
            output/corte-*/clip.mp4
            output/corte-*/manifest.json
            output/corte-*/transcricao.json
          retention-days: 5
