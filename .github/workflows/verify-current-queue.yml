name: Verify current GTA VI publication queue
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-current-queue.yml'
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      RADAR_BASE_URL: ${{ secrets.RADAR_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Compare database reservations with Buffer
        run: |
          set -euo pipefail
          case "$RADAR_BASE_URL" in https://gta-viral-radar.vercel.app|https://gta-viral-radar.vercel.app/) ;; *) exit 1;; esac
          for attempt in {1..30}; do
            code=$(curl -sS --max-time 65 -o /tmp/current-queue.json -w '%{http_code}' -X POST -H "Authorization: Bearer $CRON_SECRET" "${RADAR_BASE_URL%/}/api/cron/buffer?action=current-queue" || true)
            if [ "$code" = 200 ]; then break; fi
            if [ "$code" = 401 ]; then exit 1; fi
            sleep 10
          done
          test "$code" = 200
          python3 - <<'PY'
          import json
          data=json.load(open("/tmp/current-queue.json"))
          print(json.dumps(data,ensure_ascii=False))
          assert data["profiles"]["instagram"] and data["profiles"]["tiktok"]
          for post in data["posts"]:
              for platform in ("instagram","tiktok"):
                  item=post.get(platform)
                  if item:
                      assert item["id"] and item["status"] != "unconfirmed"
          PY
