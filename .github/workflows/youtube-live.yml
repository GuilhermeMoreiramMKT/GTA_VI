name: GTA Viral Radar - YouTube live chat
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gta-viral-radar-youtube-live
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Monitor YouTube live chat
        env:
          RADAR_BASE_URL: ${{ secrets.RADAR_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$RADAR_BASE_URL" && test -n "$CRON_SECRET"
          case "$RADAR_BASE_URL" in https://*) ;; *) exit 1 ;; esac
          curl --fail-with-body --silent --show-error --max-time 90 --retry 2 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${RADAR_BASE_URL%/}/api/cron/youtube/live"
